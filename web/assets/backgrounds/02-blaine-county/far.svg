<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Blaine County — far plane</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"    stop-color="#070d1e"/>
    <stop offset="0.22" stop-color="#0f1c39"/>
    <stop offset="0.38" stop-color="#1e3457"/>
    <stop offset="0.48" stop-color="#39587a"/>
    <stop offset="0.54" stop-color="#7c8390"/>
    <stop offset="0.59" stop-color="#c08a63"/>
    <stop offset="0.66" stop-color="#e8ab72"/>
    <stop offset="1"    stop-color="#f2c489"/>
  </linearGradient>

  <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0"   stop-color="#dbe8ff" stop-opacity="0.38"/>
    <stop offset="0.4" stop-color="#93aad6" stop-opacity="0.12"/>
    <stop offset="1"   stop-color="#6d84b8" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="afterglow" cx="0.5" cy="1" r="0.7">
    <stop offset="0"    stop-color="#ffc489" stop-opacity="0.55"/>
    <stop offset="0.45" stop-color="#d98a56" stop-opacity="0.18"/>
    <stop offset="1"    stop-color="#a8562f" stop-opacity="0"/>
  </radialGradient>

  <pattern id="s1" width="167" height="131" patternUnits="userSpaceOnUse">
    <circle cx="23"  cy="41"  r="1.7" fill="#dce6ff" opacity="0.85"/>
    <circle cx="118" cy="19"  r="1.2" fill="#cddaff" opacity="0.55"/>
    <circle cx="79"  cy="103" r="1.4" fill="#ffffff" opacity="0.45"/>
  </pattern>
  <pattern id="s2" width="223" height="97" patternUnits="userSpaceOnUse">
    <circle cx="61"  cy="27" r="1.1" fill="#eef3ff" opacity="0.5"/>
    <circle cx="176" cy="71" r="1.9" fill="#ffffff" opacity="0.65"/>
  </pattern>
  <pattern id="s3" width="311" height="179" patternUnits="userSpaceOnUse">
    <circle cx="137" cy="58"  r="2.2" fill="#ffffff" opacity="0.5"/>
    <circle cx="268" cy="141" r="1.3" fill="#d8e4ff" opacity="0.4"/>
  </pattern>
  <linearGradient id="starfade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"    stop-color="#fff" stop-opacity="1"/>
    <stop offset="0.72" stop-color="#fff" stop-opacity="0.3"/>
    <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="starmask"><rect width="1920" height="700" fill="url(#starfade)"/></mask>
</defs>

<rect width="1920" height="1080" fill="url(#sky)"/>

<g mask="url(#starmask)">
  <rect width="1920" height="700" fill="url(#s1)"/>
  <rect width="1920" height="700" fill="url(#s2)"/>
  <rect width="1920" height="700" fill="url(#s3)"/>
</g>

<circle cx="1466" cy="196" r="250" fill="url(#moonglow)"/>
<circle cx="1466" cy="196" r="30" fill="#eaf1ff" opacity="0.9"/>
<circle cx="1478" cy="188" r="26" fill="#101a30" opacity="0.5"/>

<ellipse cx="700" cy="672" rx="920" ry="230" fill="url(#afterglow)"/>

<path d="M0 700 L170 664 L300 690 L470 636 L640 676 L800 622 L980 668 L1160 630 L1340 674 L1520 640 L1700 682 L1860 652 L1920 672 L1920 780 L0 780 Z"
      fill="#5d7191" opacity="0.55"/>

<path d="M0 736 L150 706 L330 738 L500 692 L690 730 L880 686 L1080 726 L1270 690 L1470 730 L1660 696 L1840 734 L1920 716 L1920 820 L0 820 Z"
      fill="#43587c" opacity="0.75"/>
</svg>
