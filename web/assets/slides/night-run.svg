<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<title>Night run</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"    stop-color="#05070f"/>
    <stop offset="0.40" stop-color="#0b1224"/>
    <stop offset="0.70" stop-color="#182a44"/>
    <stop offset="1"    stop-color="#2e4258"/>
  </linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1c2130"/>
    <stop offset="1" stop-color="#080a12"/>
  </linearGradient>
  <radialGradient id="citybloom" cx="0.5" cy="1" r="0.7">
    <stop offset="0"   stop-color="#ffc98d" stop-opacity="0.30"/>
    <stop offset="1"   stop-color="#e07a45" stop-opacity="0"/>
  </radialGradient>

  <!-- A trail: bright core, soft falloff, tapering to nothing. -->
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"    stop-color="#ff9a5e" stop-opacity="0"/>
    <stop offset="0.18" stop-color="#ffb877" stop-opacity="0.55"/>
    <stop offset="0.62" stop-color="#ffe0b4" stop-opacity="0.95"/>
    <stop offset="1"    stop-color="#fff4de" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="cool" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0"    stop-color="#ff5a5a" stop-opacity="0"/>
    <stop offset="0.20" stop-color="#ff6b5a" stop-opacity="0.6"/>
    <stop offset="0.66" stop-color="#ff8f70" stop-opacity="0.9"/>
    <stop offset="1"    stop-color="#ffd0b4" stop-opacity="0"/>
  </linearGradient>

  <pattern id="win" width="15" height="23" patternUnits="userSpaceOnUse">
    <rect width="15" height="23" fill="#0c1424"/>
    <rect x="4" y="5" width="5" height="8" fill="#ffd39a" opacity="0.45"/>
  </pattern>
</defs>

<rect width="1280" height="720" fill="url(#sky)"/>
<ellipse cx="640" cy="470" rx="760" ry="240" fill="url(#citybloom)"/>

<!-- skyline framing the road -->
<g>
  <rect x="-10" y="286" width="86"  height="200" fill="url(#win)"/>
  <rect x="70"  y="342" width="62"  height="144" fill="#0d1524"/>
  <rect x="126" y="252" width="74"  height="234" fill="url(#win)"/>
  <rect x="194" y="330" width="56"  height="156" fill="#0c1322"/>
  <rect x="244" y="298" width="70"  height="188" fill="url(#win)"/>
  <rect x="308" y="358" width="52"  height="128" fill="#0d1524"/>

  <rect x="930"  y="352" width="54" height="134" fill="#0d1524"/>
  <rect x="978"  y="276" width="76" height="210" fill="url(#win)"/>
  <rect x="1048" y="330" width="58" height="156" fill="#0c1322"/>
  <rect x="1100" y="240" width="82" height="246" fill="url(#win)"/>
  <rect x="1176" y="316" width="64" height="170" fill="#0d1524"/>
  <rect x="1234" y="284" width="60" height="202" fill="url(#win)"/>
</g>

<!-- road running away from us -->
<path d="M580 452 L700 452 L1180 720 L100 720 Z" fill="url(#road)"/>
<path d="M580 452 L586 452 L184 720 L100 720 Z" fill="#39404f" opacity="0.35"/>
<path d="M694 452 L700 452 L1180 720 L1096 720 Z" fill="#39404f" opacity="0.35"/>

<!-- overhead gantry -->
<g fill="#080b14">
  <rect x="352" y="330" width="10" height="126"/>
  <rect x="918" y="330" width="10" height="126"/>
  <rect x="352" y="322" width="576" height="11"/>
</g>

<!-- light trails: outbound white, inbound red -->
<g>
  <path d="M612 456 C660 512 800 604 1080 700" stroke="url(#warm)" stroke-width="7"  fill="none" stroke-linecap="round"/>
  <path d="M620 458 C672 516 818 610 1104 706" stroke="url(#warm)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M646 452 C690 506 812 588 1040 664" stroke="url(#warm)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55"/>

  <path d="M666 456 C620 512 486 604 214 700" stroke="url(#cool)" stroke-width="7"  fill="none" stroke-linecap="round"/>
  <path d="M658 458 C608 516 470 610 190 706" stroke="url(#cool)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M634 452 C592 506 476 588 254 664" stroke="url(#cool)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
</g>

<!-- street lamps down the shoulder -->
<g fill="#080b14">
  <rect x="540" y="416" width="5" height="42"/><rect x="524" y="414" width="20" height="5"/>
  <rect x="482" y="440" width="6" height="56"/><rect x="462" y="438" width="24" height="5"/>
  <rect x="394" y="474" width="8" height="76"/><rect x="368" y="472" width="30" height="6"/>
  <rect x="244" y="528" width="10" height="108"/><rect x="210" y="526" width="38" height="7"/>

  <rect x="736" y="416" width="5" height="42"/><rect x="736" y="414" width="20" height="5"/>
  <rect x="794" y="440" width="6" height="56"/><rect x="794" y="438" width="24" height="5"/>
  <rect x="880" y="474" width="8" height="76"/><rect x="882" y="472" width="30" height="6"/>
  <rect x="1028" y="528" width="10" height="108"/><rect x="1032" y="526" width="38" height="7"/>
</g>
<g fill="#ffe0b0">
  <circle cx="527" cy="418" r="4"  opacity="0.85"/>
  <circle cx="464" cy="442" r="5"  opacity="0.85"/>
  <circle cx="371" cy="477" r="6"  opacity="0.85"/>
  <circle cx="214" cy="532" r="8"  opacity="0.85"/>
  <circle cx="753" cy="418" r="4"  opacity="0.85"/>
  <circle cx="815" cy="442" r="5"  opacity="0.85"/>
  <circle cx="908" cy="477" r="6"  opacity="0.85"/>
  <circle cx="1065" cy="532" r="8" opacity="0.85"/>
</g>
</svg>
