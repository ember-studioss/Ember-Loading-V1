<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<title>Harbour freight</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"    stop-color="#101a2e"/>
    <stop offset="0.34" stop-color="#22364f"/>
    <stop offset="0.60" stop-color="#4a5a70"/>
    <stop offset="0.82" stop-color="#9a7d74"/>
    <stop offset="1"    stop-color="#e0a878"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#4b4c5e"/>
    <stop offset="0.4" stop-color="#232a3d"/>
    <stop offset="1"   stop-color="#0d1220"/>
  </linearGradient>
  <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0"   stop-color="#ffe3ae" stop-opacity="0.75"/>
    <stop offset="1"   stop-color="#ffbe6b" stop-opacity="0"/>
  </radialGradient>

  <!-- gantry crane -->
  <g id="crane" fill="#0d1422">
    <rect x="-104" y="-16" width="272" height="15"/>
    <path d="M168 -16 L246 -44 L246 -30 L168 -1 Z"/>
    <rect x="-104" y="-30" width="14" height="14"/>
    <rect x="-86" y="-142" width="13" height="126"/>
    <rect x="60"  y="-142" width="13" height="126"/>
    <rect x="-92" y="-152" width="172" height="12"/>
    <path d="M-80 -152 L-8 -262 L4 -262 L-68 -152 Z"/>
    <path d="M66 -152 L-6 -262 L6 -262 L78 -152 Z"/>
    <rect x="-12" y="-276" width="18" height="18"/>
    <rect x="-58" y="-40" width="34" height="26"/>
    <rect x="-6"  y="-1"  width="14" height="86"/>
    <rect x="-30" y="82"  width="62" height="14"/>
  </g>
</defs>

<rect width="1280" height="720" fill="url(#sky)"/>

<!-- far shore -->
<rect x="0" y="418" width="1280" height="10" fill="#1a2436" opacity="0.8"/>
<g fill="#151d2e" opacity="0.75">
  <rect x="60"  y="392" width="46" height="28"/>
  <rect x="130" y="380" width="30" height="40"/>
  <rect x="190" y="398" width="58" height="22"/>
  <rect x="980" y="386" width="38" height="34"/>
  <rect x="1040" y="396" width="64" height="24"/>
  <rect x="1130" y="378" width="28" height="42"/>
</g>

<!-- water -->
<rect x="0" y="428" width="1280" height="292" fill="url(#water)"/>
<g opacity="0.3" fill="#e8c9a4">
  <rect x="150" y="452" width="120" height="2.5"/>
  <rect x="520" y="466" width="180" height="3"/>
  <rect x="900" y="448" width="140" height="2.5"/>
  <rect x="320" y="492" width="200" height="3.5"/>
  <rect x="820" y="504" width="230" height="3.5"/>
</g>

<!-- quay -->
<rect x="0" y="470" width="1280" height="16" fill="#0b111d"/>
<rect x="0" y="486" width="1280" height="234" fill="#080d17"/>

<!-- container stacks -->
<g>
  <rect x="60"  y="422" width="104" height="26" fill="#8a4436"/>
  <rect x="60"  y="396" width="104" height="26" fill="#3f6f7a"/>
  <rect x="60"  y="370" width="104" height="26" fill="#7a6a3a"/>
  <rect x="172" y="422" width="104" height="26" fill="#42607f"/>
  <rect x="172" y="396" width="104" height="26" fill="#8a4436"/>
  <rect x="284" y="422" width="104" height="26" fill="#3f6f7a"/>
  <rect x="284" y="396" width="104" height="26" fill="#6d4a6a"/>
  <rect x="284" y="370" width="104" height="26" fill="#42607f"/>
  <rect x="284" y="344" width="104" height="26" fill="#8a4436"/>

  <rect x="900"  y="422" width="104" height="26" fill="#3f6f7a"/>
  <rect x="900"  y="396" width="104" height="26" fill="#7a6a3a"/>
  <rect x="1012" y="422" width="104" height="26" fill="#8a4436"/>
  <rect x="1012" y="396" width="104" height="26" fill="#42607f"/>
  <rect x="1012" y="370" width="104" height="26" fill="#3f6f7a"/>
  <rect x="1124" y="422" width="104" height="26" fill="#6d4a6a"/>
</g>
<!-- knock the containers back so the cranes read on top -->
<rect x="0" y="330" width="1280" height="140" fill="#0d1422" opacity="0.22"/>

<use href="#crane" transform="translate(360,470) scale(1.02)"/>
<use href="#crane" transform="translate(760,470) scale(1.24)"/>

<!-- a container ship alongside -->
<g>
  <path d="M420 452 L980 452 L946 500 L452 500 Z" fill="#0a1018"/>
  <rect x="470" y="424" width="80"  height="28" fill="#2c4155"/>
  <rect x="560" y="418" width="90"  height="34" fill="#7a3d33"/>
  <rect x="660" y="424" width="80"  height="28" fill="#375f68"/>
  <rect x="750" y="416" width="96"  height="36" fill="#6a5c33"/>
  <rect x="856" y="426" width="76"  height="26" fill="#2c4155"/>
  <rect x="892" y="392" width="52"  height="34" fill="#141d2c"/>
  <rect x="912" y="368" width="9"   height="26" fill="#141d2c"/>
</g>

<!-- quayside lamps -->
<g fill="#0b111d">
  <rect x="180" y="384" width="7" height="88"/>
  <rect x="164" y="378" width="40" height="8"/>
  <rect x="1080" y="384" width="7" height="88"/>
  <rect x="1064" y="378" width="40" height="8"/>
</g>
<circle cx="184" cy="382" r="46" fill="url(#lamp)"/>
<circle cx="1084" cy="382" r="46" fill="url(#lamp)"/>
<circle cx="184" cy="382" r="6" fill="#ffeecb"/>
<circle cx="1084" cy="382" r="6" fill="#ffeecb"/>
</svg>
